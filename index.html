<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Compare DODGER, distance CBF, collision-cone CBF, and DPCBF navigation on a MuJoCo humanoid among dynamic obstacles.">
    <title>DODGER · Humanoid Navigation</title>
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css?v=dodger-3">
</head>
<body class="unitree-g1-active">
    <main class="canvas-stack" aria-label="Humanoid point navigation playground">
        <div id="unitreeG1Host">
            <div class="unitree-g1-initial-loading" role="status" aria-live="polite">
                <span class="unitree-g1-loader" aria-hidden="true"></span>
                <strong>Loading Unitree G1…</strong>
                <small>Preparing physics, robot model, and locomotion policy.</small>
            </div>
        </div>
        <div class="failure-overlay" id="failureOverlay" hidden role="button" tabindex="0" aria-label="Click anywhere to replay the stopped scene">
            <div class="failure-card"><h2 id="failureTitle">Collision</h2>
            <p id="failureMessage">Simulation stopped.</p>
            <span class="failure-replay-hint">Click anywhere to replay</span></div>
        </div>
    </main>
    <noscript>This playground requires JavaScript to run MuJoCo and the locomotion policy.</noscript>
    <script type="module" src="./app/main.js?v=dodger-3"></script>
</body>
</html>
